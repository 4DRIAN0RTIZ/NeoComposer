[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neocomposer"
version = "0.1.0"
description = "Minimal terminal email client — compose with Neovim, attach with Yazi, automate with CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "4DRIAN0RTIZ" }]
dependencies = [
    "python-dotenv==1.0.0",
]

[project.scripts]
neocomposer = "neocomposer.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/neocomposer"]

[tool.hatch.build.targets.wheel.force-include]
"src/neocomposer/signature.html" = "neocomposer/signature.html"

[tool.hatch.build.targets.sdist]
include = [
    "src/neocomposer/**",
    "README.md",
]
